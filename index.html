<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Sense referrer cap a altres webs: la veu en línia (js/veu.js) no respon si el rep. -->
<meta name="referrer" content="same-origin">
<meta name="description" content="Aprèn kanji amb fitxes, ordre de traços i repetició espaiada.">
<title>Kanji</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css?v=16">
<script>
  // Tema abans de pintar, perquè no parpellegi.
  try { const th = localStorage.getItem('kanji:tema'); if (th) document.documentElement.dataset.theme = th; } catch {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="brand-k" lang="ja" aria-hidden="true">漢</span><span data-i18n="app.name">Kanji</span></a>
  <nav class="nav" data-i18n-aria="nav.label">
    <a href="#/" data-nav="home">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
      <span data-i18n="nav.home">Inici</span>
    </a>
    <a href="#/practica" data-nav="practice">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="13" height="13" rx="2"/><path d="M7.5 3.5h11a2 2 0 0 1 2 2v11"/></svg>
      <span data-i18n="nav.practice">Practicar</span><b id="dueBadge" class="badge" hidden></b>
    </a>
    <a href="#/calendari" data-nav="calendar">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>
      <span data-i18n="nav.calendar">Calendari</span>
    </a>
    <a href="#/afegir" data-nav="add">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>
      <span data-i18n="nav.add">Afegir</span>
    </a>
  </nav>
  <div class="top-tools">
    <div id="langs" class="langs" role="group" data-i18n-aria="lang.label"></div>
    <button type="button" id="themeBtn" class="icon-btn" data-i18n-title="theme" data-i18n-aria="theme">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main class="main">
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="view"></div>
</main>

<footer class="foot">
  <span id="saveState" class="state"></span>
  <span class="tools">
    <button type="button" id="exportBtn" class="ghost" data-i18n="file.export">Exportar</button>
    <button type="button" id="importBtn" class="ghost" data-i18n="file.import">Importar</button>
    <button type="button" id="fileBtn" class="ghost" data-i18n="file.file">Arxiu</button>
  </span>
  <p class="credits"><span data-i18n="foot.strokes">Ordre de traços:</span>
    <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> © Ulrich Apel,
    <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a></p>
</footer>

<input id="importInput" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/i18n.js?v=16"></script>
<script src="js/util.js?v=16"></script>
<script src="js/almacen.js?v=16"></script>
<script src="js/validar.js?v=16"></script>
<script src="js/store.js?v=16"></script>
<script src="js/prompt.js?v=16"></script>
<script src="js/veu.js?v=16"></script>
<script src="js/traces.js?v=16"></script>
<script src="js/inici.js?v=16"></script>
<script src="js/fitxa.js?v=16"></script>
<script src="js/afegir.js?v=16"></script>
<script src="js/practica.js?v=16"></script>
<script src="js/calendari.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
