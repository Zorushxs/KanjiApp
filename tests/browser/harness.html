<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>harness</title></head>
<body>
<pre id="out"></pre>
<iframe id="f" style="width:420px;height:900px"></iframe>
<script src="sample.js"></script>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
let fails = 0;
const log = s => { out.textContent += s + '\n'; };
const ok = (c, m) => { if (!c) fails++; log((c ? 'ok   ' : 'FAIL ') + m); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => f.contentWindow, D = () => f.contentDocument, $ = s => D().querySelector(s), $$ = s => [...D().querySelectorAll(s)];
async function until(fn, ms = 8000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch {} await sleep(50); } return null; }
const G = n => { try { return W().eval(n); } catch { return undefined; } };
const go = async h => { W().location.hash = h; await sleep(120); };
const type = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
const key = k => D().body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));

(async () => {
  try {
    localStorage.clear();
    f.src = '../../index.html#/'; await new Promise(r => { f.onload = r; });
    await until(() => G('App') && $('#view .screen'));
    await sleep(200);
    ok(!!$('.empty h1') && /Encara no tens/.test($('.empty h1').textContent), 'inici buit: ' + ($('.empty h1') || {}).textContent);
    ok($('#saveState').textContent.includes('navegador'), 'estat de desat: ' + $('#saveState').textContent);

    await go('#/afegir');
    type($('.kin'), 'Vull: 日月火 水人木金, i res més 日');
    ok($$('.kchip').length === 7, 'detecta 7 kanji únics: ' + $$('.kchip').map(x => x.textContent).join(''));
    ok($('.ptext').value.includes('these kanji: 日、月、火、水、人、木、金'), 'prompt amb els kanji');
    type($('.paste'), SAMPLE);
    await until(() => $('.result:not([hidden]) .grp'));
    const groups = $$('.grp').map(g => g.className.replace('grp g-', '') + ':' + g.querySelectorAll('.rows > li').length).join(' ');
    ok(groups === 'new:6 err:1', 'previsualització: ' + groups);
    ok($('.result .note') && /Aquí tens les fitxes:.*Si vols, en puc fer més\./.test($('.result .note').textContent), 'nota de Claude (text de fora del bloc): ' + ($('.result .note') || {}).textContent);
    ok($('.g-err .msgs .e').textContent.includes('katakana'), 'error de 金: ' + $('.g-err .msgs .e').textContent);
    const warns = $$('.g-new .msgs .w').map(x => x.textContent);
    ok(warns.some(w => /emoji/i.test(w)), 'avís emoji de 木');
    ok(!$('.result img') && !$('.result svg[onload]') && !W().__xss, 'cap HTML injectat a la previsualització');
    ok($('[data-act="apply"]').textContent.includes('6'), 'botó: ' + $('[data-act="apply"]').textContent);
    $('[data-act="apply"]').click();
    await sleep(100);
    ok(G('Store').kanji.length === 6, 'desats 6 kanji');
    ok($('.ok-line') && /6 nous/.test($('.ok-line').textContent), 'missatge: ' + ($('.ok-line') || {}).textContent);
    await sleep(600);
    const saved = JSON.parse(localStorage.getItem('kanji:dades') || 'null');
    ok(saved && saved.version === 1 && saved.kanji.length === 6 && saved.progress && Object.keys(saved.progress).length === 0, 'desat a localStorage amb {version, kanji, progress}');

    // Regenerar: tornar a enganxar la mateixa resposta → sense canvis
    type($('.paste'), SAMPLE);
    await until(() => $('.result:not([hidden]) .grp'));
    ok($$('.grp').map(g => g.className.replace('grp g-', '')).join(' ') === 'same err', 'reenganxar → sense canvis');

    // Els que ja tens no van al prompt; tocant-los s'hi afegeixen per regenerar-los
    type($('.kin'), '日月 空');
    ok($$('.kchip.has').length === 2 && $$('span.kchip').length === 1, 'xips: 2 ja existents en gris, 1 nou');
    ok($('.ptext').value.split(String.fromCharCode(10))[0].endsWith('these kanji: 空.'), 'el prompt només porta 空');
    $('.kchip.has').click();
    ok($('.kchip.regen') && $('.ptext').value.includes('these kanji: 日、空'), 'tocar 日 → entra al prompt per regenerar');
    $('.kchip.regen').click();
    type($('.kin'), '日月');
    ok($('.ptext').value === '' && /Ja tens tots/.test($('.picked').textContent), 'tots existents → prompt buit i avís');
    type($('.kin'), '');

    // "Que els triï Claude": prompt amb la llista, la quantitat, la temàtica i les paraules
    Object.defineProperty(W().navigator.clipboard, 'writeText', { configurable: true, value: async s => { W().__copied = s; } });
    W().__copied = undefined;
    $('input[name="amode"][value="more"]').click(); await sleep(50);
    ok(!$('.mode-more').hidden && $('.mode-own').hidden && $('.pview').hidden, 'mode «Claude tria els kanjis», sense previsualització');
    ok(W().__copied === undefined, 'clicar el mode no copia res');
    ok($$('.seg span').slice(0, 2).map(s => s.textContent).join(' | ') === 'Trio els kanjis | Claude tria els kanjis', 'noms: ' + $$('.seg span').slice(0, 2).map(s => s.textContent).join(' | '));
    ok(/6 que ja tens/.test($('.mode-more .hint').textContent), 'avís: ' + $('.mode-more .hint').textContent.slice(0, 50));
    ok($('.more-n').value === '' && $('.more-n').placeholder === '10', 'Quants: buit amb un 10 d’exemple');
    type($('.more-n'), 'a1b2');
    ok($('.more-n').type === 'text' && $('.more-n').inputMode === 'numeric' && $('.more-n').value === '12', 'Quants: sense fletxetes, teclat numèric i només xifres');
    type($('.more-n'), '7'); type($('.more-theme'), 'menjar'); type($('.more-words'), 'gat, escola');
    $('[data-act="copy"]').click(); await sleep(100);
    const cp = W().__copied || '';
    ok(cp.includes('The kanji I have already learned are: 日, 月, 火, 水, 人, 木') && cp.includes('I want to learn 7 new kanji:'), 'prompt: llista separada per comes i quantitat');
    ok(cp.includes('about this theme: "menjar"') && cp.includes('In addition to those kanji, I want to learn these specific words: gat, escola') && !cp.includes('usual learning order'), 'prompt: 7 kanji de la temàtica i, a més, les paraules');
    ok(cp.includes('patata → じゃがいも, not 芋') && cp.includes('Make a word card for each'), 'prompt: paraules tal com s’escriuen al Japó');
    ok(cp.includes('"reading": "にち"') && cp.includes('"romaji": ""') && cp.includes('Hepburn'), 'prompt: format amb lectura principal i rōmaji de la frase');
    type($('.more-theme'), ''); type($('.more-words'), ''); $('[data-act="copy"]').click(); await sleep(100);
    ok((W().__copied || '').includes('usual learning order (JLPT N5 first'), 'sense temàtica ni paraules: els més útils');
    const arr = JSON.parse(SAMPLE.slice(SAMPLE.indexOf('['), SAMPLE.lastIndexOf(']') + 1));
    const yama = { kanji: '山', meanings: { ca: ['muntanya'], es: ['montaña'], en: ['mountain'] }, onyomi: ['サン'], kunyomi: ['やま'], reading: 'やま', strokes: 3, jlpt: 5 };
    type($('.paste'), '```json' + JSON.stringify([yama, arr[1]]) + '```');
    await until(() => $$('.result .rows > li').length === 2, 4000);
    ok($$('.grp').map(g => g.className.replace('grp g-', '') + ':' + g.querySelectorAll('.rows > li').length).join(' ') === 'new:1 have:1', 'resposta: 1 nou i 1 que ja tenies');
    ok(/Desar 1 kanji/.test($('[data-act="apply"]').textContent), 'només es desa el nou');
    ok($('.g-new .rm').textContent.includes('やま') && $('.g-new .rm .ro').textContent === 'yama', 'previsualització amb lectura principal i rōmaji');
    $('[data-act="apply"]').click(); await sleep(100);
    ok(G('Store').kanji.length === 7 && G('Store').get('月').meanings.ca[0] === 'lluna', '山 afegit i 月 intacte');
    G('Store').remove('山');
    $('input[name="amode"][value="own"]').click(); await sleep(50);
    ok(!$('.mode-own').hidden && !$('.pview').hidden, 'tornar a «Els escric jo»');
    await go('#/');
    ok($$('.tile').length === 6, 'graella amb 6 fitxes');
    ok($('.stat b').textContent === '0' && $$('.stat b')[1].textContent === '6', 'stats: 0 per repassar, 6 nous');
    type($('.search'), 'lluna'); ok($$('.tile').length === 1 && $('.tile-k').textContent === '月', 'cerca "lluna" → 月');
    type($('.search'), 'にち'); ok($$('.tile').length === 1 && $('.tile-k').textContent === '日', 'cerca "にち" (hiragana) troba ニチ → 日');
    type($('.search'), 'ひと'); ok($$('.tile').map(x => x.querySelector('.tile-k').textContent).join('') === '人', 'cerca "ひと" → 人');
    type($('.search'), 'tsuki'); ok($$('.tile').map(x => x.querySelector('.tile-k').textContent).join('') === '月', 'cerca en rōmaji "tsuki" → 月');
    type($('.search'), 'mizu'); ok($$('.tile').map(x => x.querySelector('.tile-k').textContent).join('') === '水', 'cerca en rōmaji "mizu" → 水');
    type($('.search'), '');
    $$('.chip').find(c => c.textContent === 'N4').click();
    ok($$('.tile').length === 1 && $('.tile-k').textContent === '木', 'filtre N4 → 木');
    $$('.chip').find(c => c.dataset.lv === 'all').click();
    ok(!W().__xss && !$('.tile img'), 'graella sense injecció');

    // Ordenar arrossegant (a l'ordinador): una sola DataTransfer per a tot l'arrossegament, com al navegador
    const order = () => $$('.tile').map(x => x.dataset.k).join('');
    const drag = (from, to, cancel) => {
      const dt = new DataTransfer(), ev = (el, type) => el.dispatchEvent(new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: dt }));
      ev(from, 'dragstart'); ev(to, 'dragover');
      if (!cancel) ev(to, 'drop');
      ev(from, 'dragend');
    };
    const tileOf = k => $(`.tile[data-k="${k}"]`);
    const initial = order();
    ok(/Reordenar.*R/.test($('.sort-btn').textContent) && $('.sort-btn').getAttribute('aria-pressed') === 'false', 'botó «Reordenar R» a l’ordinador');
    ok(!$('.grid').classList.contains('sortable'), 'per defecte no s’ordena');
    drag(tileOf('日'), tileOf('火'));
    ok(order() === initial, 'sense el mode, arrossegar no canvia res: ' + order());
    key('r');
    ok($('.grid').classList.contains('sortable') && $('.sort-btn').getAttribute('aria-pressed') === 'true', 'tecla R → mode ordenar');
    ok(W().getComputedStyle($('.tile-k')).userSelect === 'none', 'en mode ordenar, el text de les fitxes no se selecciona');
    tileOf('日').click(); await sleep(100);
    ok(W().location.hash === '#/' && $('.grid'), 'en mode ordenar, un clic no obre la fitxa');
    drag(tileOf('日'), tileOf('火'));
    const storeOrder = () => G('Store').kanji.map(c => c.kanji).join('');
    ok(order() === '月火日水人木' && storeOrder() === '月火日水人木', 'arrossegar 日 sobre 火 → ' + order() + ' / ' + storeOrder());
    drag(tileOf('人'), tileOf('月'), true);
    ok(order() === '月火日水人木' && storeOrder() === '月火日水人木', 'arrossegar i cancel·lar → no canvia res: ' + order());
    drag(tileOf('日'), tileOf('月'));
    ok(order() === initial && storeOrder() === initial, 'tornar-lo a lloc: ' + order());
    key('Escape');
    ok(!$('.grid').classList.contains('sortable') && $('.sort-btn').getAttribute('aria-pressed') === 'false', 'Esc → surt del mode');
    $('.sort-btn').click();
    ok($('.grid').classList.contains('sortable'), 'el botó també l’encén');
    $('.sort-btn').click();
    ok(!$('.grid').classList.contains('sortable'), 'i l’apaga');

    // Fitxa
    $$('.tile')[0].click();
    await until(() => $('.hero-k'));
    ok($('.hero-k').textContent === '日' && $('.means').textContent === 'sol · dia', 'fitxa 日: ' + $('.means').textContent);
    ok($$('.rd-v')[0].textContent === 'ニチ、ジツ', 'on: ' + $$('.rd-v')[0].textContent);
    ok($$('.rd .say').length === 2 && $('.hero > .say').dataset.say === 'にち', 'la veu de dalt diu la lectura principal: ' + $('.hero > .say').dataset.say);
    ok(/にち/.test($('.main-r').textContent) && $('.main-r .ro').textContent === 'nichi', 'lectura principal: ' + $('.main-r').textContent.trim().replace(/\s+/g, ' '));
    ok($('.is-main') && $('.is-main').textContent === 'ニチ', 'la lectura principal es destaca a la llista');
    ok($$('.rd-ro').map(x => x.textContent).join(' | ') === 'nichi, jitsu | hi, -bi, -ka', 'rōmaji de les lectures: ' + $$('.rd-ro').map(x => x.textContent).join(' | '));
    ok($$('.ex-r .ro').map(x => x.textContent).join(',') === 'nihon,mainichi,nichiyoubi', 'rōmaji dels exemples: ' + $$('.ex-r .ro').map(x => x.textContent).join(','));
    ok($('.sent-ro').textContent === 'Mainichi nihongo o benkyou shimasu.', 'rōmaji de la frase (de Claude)');
    ok($$('.ex li').length === 3 && $('.ex mark').textContent === '日', 'exemples amb el kanji ressaltat');
    ok($$('details.fold').length === 2 && !$('details.fold').open, 'origen i curiositat plegats');
    ok($('a[href*="jisho.org"]').href.includes('%E6%97%A5%20%23kanji'), 'enllaç a Jisho');
    const so = await until(() => $$('.so-ink path').length, 15000);
    ok(so === 4, 'KanjiVG: ' + so + ' traços dibuixats');
    ok($$('.so-num text').length === 4, 'números de traç');
    // ---- Veu: consola i alternatives ----
    const C = W().console, logs = [], NL7 = String.fromCharCode(10) + '       ';
    ['info', 'warn', 'error'].forEach(k => { const f = C[k].bind(C); C[k] = (...x) => { logs.push(k + ': ' + x.join(' ')); f(...x); }; });
    const table = C.table.bind(C); let tabled = 0; C.table = x => { tabled = x.length; table(x); };
    const V = G('Veu'), ss = W().speechSynthesis, realVoices = ss.getVoices.bind(ss), realSpeak = ss.speak.bind(ss), RealAudio = W().Audio;
    const hasJa = ss.getVoices().some(v => /^ja/i.test(v.lang));
    const run = async (label, fn) => { logs.length = 0; const r = await fn().then(x => x, e => 'ERR ' + e.message); log('     ' + label + ' → ' + r + NL7 + logs.join(NL7)); return r; };
    // 1. Amb veu japonesa al navegador
    let r = await run('amb veu japonesa', () => V.say('にち'));
    ok(!hasJa || (r === 'device' && logs.some(l => /veus, \d+ en japonès/.test(l)) && logs.some(l => /veu del navegador:/.test(l)) && logs.some(l => /Sona ✓/.test(l))), (hasJa ? '' : '(sense veu japonesa al navegador, omès) ') + 'consola: veu del navegador i «Sona ✓»');
    // 2. Sense veu japonesa (com Opera)
    ss.getVoices = () => realVoices().filter(v => !/^ja/i.test(v.lang)); ss.onvoiceschanged();
    r = await run('sense veu japonesa', () => V.say('ひ'));
    ok(r === 'online' && logs.some(l => /veu en línia de Google/.test(l)) && logs.some(l => /Sona ✓/.test(l)), 'consola: veu en línia i «Sona ✓»');
    // 3. La veu del navegador falla → prova la en línia
    ss.getVoices = realVoices; ss.onvoiceschanged();
    ss.speak = u => setTimeout(() => u.onerror({ error: 'synthesis-failed' }), 20);
    r = await run('veu del navegador que falla', () => V.say('つき'));
    ok(!hasJa || (r === 'online' && logs.some(l => /^warn: .*no ha funcionat: error «synthesis-failed».*Provo la veu en línia/.test(l))), (hasJa ? '' : '(sense veu japonesa al navegador, omès) ') + 'consola: avís de fallada i passa a la veu en línia');
    // 4. Tampoc funciona la veu en línia → error a la consola i avís a la pantalla
    W().Audio = function () { return new RealAudio('https://translate.google.com/no-existeix'); };
    logs.length = 0; $('#toast').hidden = true;
    $('.rd .say').click(); await until(() => !$('#toast').hidden && logs.some(l => /No sona/.test(l)), 10000);
    ok(logs.some(l => /^error: .*No sona: Google no ha tornat àudio/.test(l)) && logs.some(l => /Prova aquesta adreça/.test(l)), 'consola: error amb motiu i adreça per provar');
    ok(/Detalls a la consola \(F12\)/.test($('#toast').textContent), 'avís a la pantalla: ' + $('#toast').textContent.slice(0, 60) + '…');
    log('       ' + logs.join(NL7));
    ss.speak = realSpeak; W().Audio = RealAudio;
    // 5. Veu.diagnose()
    r = await run('Veu.diagnose()', () => V.diagnose());
    ok(tabled > 0 && (!hasJa || logs.some(l => /Veu triada:/.test(l))), 'Veu.diagnose(): taula de ' + tabled + ' veus');
    ok(D().querySelector('meta[name="referrer"]').content === 'same-origin', 'meta referrer same-origin');
    ok(!$('.so-warn'), 'sense avís de traços (4 = 4)');
    const vb = () => $('[data-act="verify"]'), vp = () => $('[data-ver-pill]');
    ok(vb().classList.contains('ver-pending') && /Per verificar/.test(vb().textContent) && vp().hidden, 'botó: per verificar (sense pastilla)');
    vb().click();
    ok(G('Store').get('日').verified === true && vb().classList.contains('ver-ok') && /Verificat/.test(vb().textContent) && !vp().hidden, 'botó: verificat');
    vb().click();
    ok(G('Store').get('日').verified === 'error' && vb().classList.contains('ver-err') && /Té errors/.test(vp().textContent), 'botó: té errors');
    vb().click();
    ok(G('Store').get('日').verified === false && vp().hidden, 'botó: torna a per verificar');
    vb().click();
    ok(!$('input[type="checkbox"]'), 'ja no hi ha checkbox');
    ok($('.pos').textContent.trim() === '1 / 6', 'posició 1 / 6');
    key('ArrowRight'); await sleep(150);
    ok($('.hero-k').textContent === '月', 'fletxa → 月');

    // Lliscar amb el dit: es simula una pantalla tàctil (pointer: coarse) i gestos de touch
    const realMM = W().matchMedia.bind(W());
    W().matchMedia = q => (/pointer: coarse/.test(q) ? { matches: true, media: q } : realMM(q));
    const touch = (type, x, y) => {
      const ev = new (W().Event)(type, { bubbles: true });
      Object.defineProperty(ev, 'touches', { value: type === 'touchend' ? [] : [{ clientX: x, clientY: y }] });
      $('.sheet').dispatchEvent(ev);
    };
    const swipeGo = async (x0, x1, y1 = 400) => { touch('touchstart', x0, 400); touch('touchmove', (x0 + x1) / 2, (400 + y1) / 2); touch('touchmove', x1, y1); touch('touchend'); await sleep(320); };
    await go('#/k/' + encodeURIComponent('日')); await go('#/k/' + encodeURIComponent('月')); // es torna a pintar amb la pantalla tàctil
    await swipeGo(300, 120);
    ok($('.hero-k').textContent === '火' && $('.sheet').classList.contains('enter-right'), 'lliscar cap a l’esquerra → fitxa següent (火), entra per la dreta');
    await swipeGo(120, 300);
    ok($('.hero-k').textContent === '月' && $('.sheet').classList.contains('enter-left'), 'lliscar cap a la dreta → fitxa anterior (月), entra per l’esquerra');
    await swipeGo(300, 270);
    ok($('.hero-k').textContent === '月' && $('.sheet').style.transform === '', 'lliscada curta: no canvia i torna al seu lloc');
    await swipeGo(300, 200, 600);
    ok($('.hero-k').textContent === '月', 'gest més vertical que horitzontal: no canvia (es desplaça la pàgina)');
    await swipeGo(10, 300);
    ok($('.hero-k').textContent === '月', 'des de la vora de la pantalla (gest d’enrere): no canvia');
    await go('#/k/' + encodeURIComponent('日'));
    await swipeGo(120, 300);
    ok($('.hero-k').textContent === '日', 'a la primera fitxa, cap a la dreta: no n’hi ha cap d’anterior');
    W().matchMedia = realMM;
    await go('#/k/' + encodeURIComponent('月'));
    await swipeGo(300, 120);
    ok($('.hero-k').textContent === '月', 'sense pantalla tàctil (ordinador): lliscar no fa res');
    await go('#/k/' + encodeURIComponent('木'));
    ok(!W().__xss && !$('.sheet img') && !$('.sheet script') && !$('.emoji'), 'fitxa de 木 sense injecció ni emoji');
    ok($('.means').textContent.includes('<img'), 'el text hostil es veu com a text');
    const warn = await until(() => $('.so-warn'), 15000);
    ok(warn && /5.*4/.test(warn.textContent), 'avís traços: ' + (warn || {}).textContent);
    await go('#/k/' + encodeURIComponent('猫'));
    ok(/no és a la teva/.test($('.empty p').textContent), 'kanji inexistent → avís');

    // Desplegables oberts en canviar d'idioma
    await go('#/k/' + encodeURIComponent('日'));
    const fold = f => $(`details[data-fold="${f}"]`);
    fold('trivia').open = true;
    $('[data-lang="es"]').click(); await sleep(100);
    ok(fold('trivia').open && !fold('origin').open && $('.fold summary').textContent === 'Origen', 'canvi a ES: curiositat oberta, origen tancat');
    fold('origin').open = true;
    $('[data-lang="en"]').click(); await sleep(100);
    ok(fold('trivia').open && fold('origin').open && /Trivia/.test(fold('trivia').textContent), 'canvi a EN: tots dos oberts');
    $('[data-lang="ca"]').click(); await sleep(100);
    ok(fold('trivia').open && fold('origin').open, 'canvi a CA: continuen oberts');
    key('ArrowRight'); await sleep(150);
    ok($$('details[data-fold][open]').length === 0, 'altre kanji: desplegables tancats');
    await go('#/afegir'); $('.pview').open = true;
    $('[data-lang="es"]').click(); await sleep(100);
    ok($('.pview').open && /Ver el prompt/.test($('.pview summary').textContent), 'Afegir: «Veure el prompt» obert en canviar d’idioma');
    $('[data-lang="ca"]').click(); await sleep(100);
    // Idioma
    $('[data-lang="en"]').click(); await sleep(100);
    ok($('[data-nav="home"] span').textContent === 'Home' && D().documentElement.lang === 'en', 'canvi a anglès');
    await go('#/k/' + encodeURIComponent('日'));
    ok($('.means').textContent === 'sun · day' && $('.mnemo p').textContent.startsWith('A square'), 'contingut en anglès');
    ok($$('#langs button').map(b => b.textContent).join(' ') === 'CA ES EN', 'selector: CA ES EN');
    $('[data-lang="es"]').click(); await sleep(100);
    ok($('[data-nav="add"] span').textContent === 'Añadir' && $('.means').textContent === 'sol · dia', 'castellà (sense contingut es → fa servir el català)');
    await go('#/afegir/' + encodeURIComponent('日'));
    ok($('.kchip.regen') && $('.ptext').value.includes('these kanji: 日') && $('.ptext').value.includes('Spanish ("es")'), 'Regenerar des de la fitxa: 日 ja inclòs al prompt');
    $('[data-lang="ca"]').click(); await sleep(100);
    ok(localStorage.getItem('kanji:idioma') === 'ca', 'idioma recordat');

    // Pràctica
    await go('#/practica');
    ok(/0 per repassar · 6 nous/.test($('.big-line').textContent), 'preparació: ' + $('.big-line').textContent);
    ok($$('.bx button').length === 6 && $('.bx .b0 b').textContent === '6', 'caixes: 6 nous');

    // Regenerar: la lectura que has triat es manté i t'avisa que les correccions es perdran
    await go('#/afegir');
    const arr2 = JSON.parse(SAMPLE.slice(SAMPLE.indexOf('['), SAMPLE.lastIndexOf(']') + 1));
    type($('.paste'), '```json' + JSON.stringify([arr2[0]]) + '```');
    await until(() => $$('.result .g-upd .rows > li').length === 1, 4000);
    const wm = $('.result .g-upd .msgs').textContent;
    ok(/correccions teves/.test(wm) && /Es manté la teva lectura principal \(ひ\)/.test(wm), 'regenerar: avisa de les correccions i manté ひ');
    $('[data-act="apply"]').click(); await sleep(80);
    ok(S.get('日').reading === 'ひ' && S.get('日').mainByUser && !S.get('日').edited, 'després de regenerar: ひ es manté; les correccions s’han substituït');

    // Dues lectures principals: com 七 (しち / なな). Ordre del clic: 1 = primera, 2 = segona; màxim dues.
    await go('#/k/' + encodeURIComponent('月')); await go('#/k/' + encodeURIComponent('日'));
    $('[data-act="edit"]').click(); await sleep(60);
    ok(pressed() === 'ひ1', 'edició: ひ premuda amb un 1');
    mc('にち').click(); await sleep(20);
    ok(pressed() === 'にち2,ひ1' && $('[data-main-max]').hidden, 'una segona: にち amb un 2 — ' + pressed());
    mc('か').click(); await sleep(20);
    ok(pressed() === 'にち2,ひ1' && !$('[data-main-max]').hidden, 'una tercera no entra i avisa que en treguis una');
    mc('ひ').click(); await sleep(20);
    ok(pressed() === 'にち1' && $('[data-main-max]').hidden, 'treus la 1a: にち passa a ser la 1a');
    mc('ひ').click(); await sleep(20);
    ok(pressed() === 'にち1,ひ2', 'tornes a posar ひ: ara és la 2a — ' + pressed());
    type($('[data-e="kunyomi"]'), '-び, -か');
    ok(pressed() === 'にち1', 'si treus ひ de les lectures, deixa d’estar triada');
    type($('[data-e="kunyomi"]'), 'ひ, -び, -か'); mc('ひ').click(); await sleep(20);
    $('.edit-bar [data-act="save"]').click(); await sleep(80);
    const k2 = S.get('日'), mr = $('.main-r').textContent.replace(/\s+/g, ' ').trim();
    ok(!$('.sheet.editing') && k2.reading === 'にち' && k2.reading2 === 'ひ' && k2.mainByUser && !k2.edited, 'desat: にち i ひ, sense marcar «Corregida» — ' + JSON.stringify({ e: !!$('.sheet.editing'), r: k2.reading, r2: k2.reading2, m: k2.mainByUser, ed: k2.edited, kun: k2.kunyomi, err: $('.edit-errors') && $('.edit-errors').textContent }));
    ok($('.main-r small').textContent === 'Lectures principals' && /にち nichi \/ ひ hi/.test(mr) && $$('.is-main').length === 2, 'capçalera: ' + mr + ' i les dues ressaltades');
    ok($$('[data-say]').some(b => b.dataset.say === 'にち、ひ'), 'l’altaveu de dalt diu les dues');
    $('[data-act="edit"]').click(); await sleep(60);
    mc('にち').click(); await sleep(20); mc('ひ').click(); await sleep(20);
    $('.edit-bar [data-act="save"]').click(); await sleep(60);
    ok($('.sheet.editing') && /almenys una lectura principal/.test($('.edit-errors').textContent), 'sense cap: no desa i demana que en triïs una');
    $('.edit-bar [data-act="cancel"]').click(); await sleep(40);
    await go('#/afegir');
    type($('.paste'), '```json' + JSON.stringify([{ ...arr2[0], mnemonic: { ca: 'Una altra.', es: 'Otra.', en: 'Another.' } }]) + '```');
    await until(() => $$('.result .g-upd .rows > li').length === 1, 4000);
    ok(/Es mantenen les teves lectures principals \(にち \/ ひ\)/.test($('.result .g-upd .msgs').textContent), 'regenerar: avisa que es mantenen にち / ひ');
    $('[data-act="apply"]').click(); await sleep(80);
    ok(S.get('日').reading === 'にち' && S.get('日').reading2 === 'ひ' && S.get('日').mnemonic.ca === 'Una altra.', 'després de regenerar: les dues es mantenen');
    type($('.paste'), '```json' + JSON.stringify([{ ...arr2[0], mnemonic: { ca: 'Una altra.', es: 'Otra.', en: 'Another.' } }]) + '```');
    await sleep(200); await until(() => $$('.result .rows > li').length === 1, 4000);
    ok($$('.result .g-same .rows > li').length === 1, 'la mateixa resposta un altre cop: «igual» (les teves lectures no compten com a canvi)');
    type($('.paste'), '');

    // Tecles V i E per verificar des del teclat
    S.setVerified('月', false);
    await go('#/k/' + encodeURIComponent('月'));
    ok($('.panel.check .keys') && /V verificat · E té errors/.test($('.panel.check .keys').textContent), 'recordatori de les tecles a la fitxa');
    key('v'); await sleep(30);
    ok(S.get('月').verified === true && $('[data-act="verify"]').classList.contains('ver-ok') && !$('[data-ver-pill]').hidden && /月 · Verificat/.test($('#toast').textContent), 'tecla V: verificat (botó, etiqueta i avís)');
    key('V'); await sleep(30);
    ok(S.get('月').verified === false && $('[data-act="verify"]').classList.contains('ver-pending') && $('[data-ver-pill]').hidden, 'V un altre cop (també en majúscula): torna a per verificar');
    key('e'); await sleep(30);
    ok(S.get('月').verified === 'error' && $('[data-act="verify"]').classList.contains('ver-err'), 'tecla E: té errors');
    key('e'); await sleep(30);
    ok(S.get('月').verified === false, 'E un altre cop: per verificar');
    key('ArrowRight'); await sleep(150); key('v'); await sleep(30);
    ok($('.hero-k').textContent === '火' && S.get('火').verified === true, '→ i V: passes a la següent i la verifiques');
    $('[data-act="edit"]').click(); await sleep(50);
    const v火 = S.get('火').verified; key('e'); await sleep(30);
    ok(S.get('火').verified === v火, 'mentre edites, les tecles no fan res');
    $('.edit-bar [data-act="cancel"]').click(); await sleep(40);

    // ---- Etiquetes: crear-les en arbre, triar fitxes, filtrar i cercar a l'inici, fitxa i esborrar ----
    await go('#/');
    ok($('.home-tags-toggle').getAttribute('aria-expanded') === 'false' && !$('.home-tags-edit') && !$('.home-tags [data-act="tag"]'),
      'inici: les etiquetes comencen amagades, només el botó «Etiquetes»');
    $('.home-tags-toggle').click(); await sleep(30);
    ok($('.home-tags-toggle').getAttribute('aria-expanded') === 'true' && JSON.parse(localStorage.getItem('kanji:vista')).tags === true
      && D().activeElement === $('.home-tags-toggle'), '«Etiquetes» les mostra i es recorda');
    ok($('.home-tags .home-tags-edit') && $$('.home-tags [data-act="tag"]').map(c => c.dataset.tag).join() === 'none',
      'inici sense etiquetes: «Sense etiqueta» i l’enllaç per crear-ne');
    ok(!$('.finder > .chips .home-tags-edit') && !$('.finder > .chips [data-act="tag"]'), 'les etiquetes van en una fila a part');
    $('.home-tags-edit').click(); await sleep(150);
    ok(W().location.hash === '#/etiquetes' && /Encara no tens cap etiqueta/.test($('.tags-panel:last-child').textContent), 'pantalla d’etiquetes buida');
    const create = async name => {
      $('[data-form="create"] [name="label"]').value = name;
      $('[data-form="create"] .btn').click(); await sleep(60);
    };
    await create('Temps'); await create('Números'); await create('temps');
    ok(S.tags.map(x => x.name).join() === 'Temps,Números' && /Ja hi ha una etiqueta/.test($('#toast').textContent), 'crear: dues principals, la repetida no');
    $$('.tags-tree a').find(a => a.textContent.includes('Temps')).click(); await sleep(150);
    const treeNames = () => $$('.tags-tree:not(.tags-untagged) li a span').map(x => x.textContent).join();
    ok($('h1.h').textContent === 'Temps' && treeNames() === 'Temps,Números' && /Temps/.test($('.tags-tree li.on').textContent),
      'pantalla d’una etiqueta: l’arbre sencer a dalt, amb aquesta marcada');
    await create('Mesos');
    const mesosId = S.tags.find(x => x.name === 'Mesos').id;
    ok(S.tagLabel(mesosId) === 'Temps › Mesos' && treeNames() === 'Temps,Mesos,Números', 'crear a dins: surt a l’arbre');
    const moveBtn = (act, name) => $$(`.tags-tree [data-act="${act}"]`).find(b => b.closest('li').querySelector('span').textContent === name);
    ok(moveBtn('up', 'Temps').disabled && moveBtn('down', 'Números').disabled && moveBtn('up', 'Mesos').disabled, 'la primera no puja i l’última no baixa');
    moveBtn('up', 'Números').click(); await sleep(60);
    ok(treeNames() === 'Números,Temps,Mesos' && S.tagChildren('').map(x => x.name).join() === 'Números,Temps'
      && D().activeElement === moveBtn('down', 'Números'), '↑: Números puja (amb el focus al botó que encara es pot fer servir)');
    moveBtn('down', 'Números').click(); await sleep(60);
    ok(treeNames() === 'Temps,Mesos,Números' && $('h1.h').textContent === 'Temps', '↓: torna a baixar i segueixes a la mateixa etiqueta');
    $$('.tags-tree li a').find(a => a.textContent.includes('Mesos')).click(); await sleep(150);
    ok(W().location.hash === '#/etiquetes/' + mesosId && treeNames() === 'Temps,Mesos,Números' && /Mesos/.test($('.tags-tree li.on').textContent),
      'des de l’arbre vas a una altra etiqueta i l’arbre hi segueix');
    ok(/Temps/.test($('.tags-crumbs').textContent) && $$('.tile-pick').length === S.kanji.length, 'camí i totes les fitxes per triar');
    const pickTile = ch => $$('.tile-pick').find(x => x.dataset.k === ch);
    pickTile('月').click(); pickTile('日').click(); await sleep(30);
    ok(pickTile('月').getAttribute('aria-pressed') === 'true' && /^2 /.test($('.tags-count').textContent), 'tocar fitxes: 2 amb l’etiqueta');
    pickTile('日').click(); await sleep(30);
    ok(S.cardTags('月').join() === mesosId && !S.cardTags('日').length && /^1 /.test($('.tags-count').textContent), 'tornar a tocar la treu');
    type($('.tags-search'), 'lluna');
    ok($$('.tile-pick').length === 1, 'cerca dins de l’etiqueta');

    await go('#/');
    const tagChip = name => $$('.home-tags [data-act="tag"]').find(c => c.textContent === name);
    ok(tagChip('Temps') && tagChip('Números') && !tagChip('Mesos'), 'inici: les principals');
    ok($$('.home-tags [data-act="tag"]').map(c => c.textContent).join() === 'Sense etiqueta,Temps,Números', 'inici: «Sense etiqueta» la primera, i les altres en el teu ordre');
    tagChip('Temps').click(); await sleep(30);
    ok($$('.tile').map(x => x.dataset.k).join() === '月' && tagChip('Mesos') && $('.home-tags-sub'), 'Temps: inclou les de Mesos i obre la fila de dins');
    tagChip('Mesos').click(); await sleep(30);
    ok(tagChip('Mesos').getAttribute('aria-pressed') === 'true' && $$('.tile').length === 1, 'Mesos premut');
    tagChip('Temps').click(); await sleep(30);
    ok(!$('.home-tags-sub') && $$('.tile').length === S.kanji.length, 'tornar a prémer Temps treu el filtre');
    type($('.search'), 'temps');
    ok($$('.tile').map(x => x.dataset.k).join() === '月', 'cercador: «temps» troba les de Mesos');
    type($('.search'), '');
    $('.home-tags [data-tag="none"]').click(); await sleep(30);
    ok($$('.tile').length === S.kanji.length - 1 && !$$('.tile').some(x => x.dataset.k === '月'), '«Sense etiqueta»: totes menys 月');
    ok(tagChip('Temps').getAttribute('aria-pressed') === 'false' && !$('.home-tags-sub'), '«Sense etiqueta» no obre cap fila');
    $('.home-tags [data-tag="none"]').click(); await sleep(30);
    ok($$('.tile').length === S.kanji.length, 'tornar-la a prémer treu el filtre');
    type($('.search'), 'sense etiqueta');
    ok($$('.tile').length === S.kanji.length - 1, 'cercador: «sense etiqueta»');

    await go('#/k/' + encodeURIComponent('水'));
    ok(/no té cap etiqueta/.test($('.card-tags').textContent), 'fitxa sense etiquetes');
    const change = $$('.card-tags a').find(a => a.textContent === 'Canviar');
    ok(change && change.getAttribute('href') === '#/etiquetes', 'fitxa: «Canviar» porta a la pantalla d’etiquetes');
    change.click(); await sleep(150);
    ok(W().location.hash === '#/etiquetes', 'i hi va');
    S.setCardTag('水', S.tags.find(x => x.name === 'Números').id, true);
    await go('#/k/' + encodeURIComponent('水'));
    ok($('.card-tag-list') && $('.card-tag-list').textContent === 'Números', 'fitxa: es veu l’etiqueta que té');
    await go('#/');
    type($('.search'), 'numeros');
    ok($$('.tile').map(x => x.dataset.k).join() === '水', 'cercador sense accents: «numeros» → 水');
    type($('.search'), '');

    const tempsId = S.tags.find(x => x.name === 'Temps').id;
    await go('#/etiquetes/' + tempsId);
    W().confirm = () => true;
    $('[data-act="delete"]').click(); await sleep(150);
    ok(S.tags.map(x => x.name).join() === 'Números' && !S.cardTags('月').length && W().location.hash === '#/etiquetes', 'esborrar: amb les de dins, les fitxes la perden');
    ok(S.get('月'), 'la fitxa no s’esborra');
    ok($('.tags-untagged + .tags-tree') && /Sense etiqueta automàtica/.test($('.tags-untagged').textContent) && $('.tags-untagged small').textContent === String(S.kanji.length - 1),
      'llista: «Sense etiqueta» amb quantes en té (totes menys 水)');
    $('.tags-untagged a').click(); await sleep(150);
    ok(W().location.hash === '#/' && $('.home-tags [data-tag="none"]').getAttribute('aria-pressed') === 'true'
      && $$('.tile').length === S.kanji.length - 1, 'en tocar-la, l’inici amb el filtre posat');
    $('.home-tags-toggle').click(); await sleep(30);
    ok(!$('.home-tags [data-act="tag"]') && /Sense etiqueta ✕/.test($('.home-tags-clear').textContent)
      && $$('.tile').length === S.kanji.length - 1, 'amagades amb un filtre: surt quin és i es manté');
    $('.home-tags-clear').click(); await sleep(30);
    ok(!$('.home-tags-clear') && $$('.tile').length === S.kanji.length && D().activeElement === $('.home-tags-toggle'), 'un toc treu el filtre');
    $('.home-tags-toggle').click(); await sleep(30);
    ok(!$('.home-tags [data-tag="none"]').classList.contains('on'), 'en tornar-les a mostrar, cap premuda');
  } catch (e) { fails++; log('EXCEPCIÓ ' + e.stack); }
  log(fails ? `\n${fails} FAILS` : '\nTOT OK');
  document.title = 'done';
  fetch('/result', { method: 'POST', body: out.textContent });
})();
</script>
</body></html>
